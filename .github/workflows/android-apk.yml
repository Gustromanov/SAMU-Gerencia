name: Build APK Android

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto Android (Capacitor)
        run: |
          [ -d android ] || npx cap add android
          npx capacitor-assets generate --android || echo "aviso: mantendo ícones padrão"
          npx cap sync android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$MANIFEST" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"

      - name: Compilar APK (debug, instalável direto)
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SAMU192-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SAMU192-android-apk
          path: android-app/SAMU192-android.apk
          retention-days: 30

      - name: Publicar na Release (somente tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/SAMU192-android.apk
