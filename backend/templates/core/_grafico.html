{# partial — bloco de gráfico com toggle de tipo #}
<div class="rounded-2xl bg-white border border-neutrals-200 p-5 shadow-card space-y-3" data-dash="{{ id }}" data-pesquisa="{{ pesquisa }}">
    <div>
        <div class="font-display text-base font-bold text-neutrals-900 leading-tight">{{ titulo }}</div>
        <div class="text-xs text-neutrals-600 mt-1">{{ descricao }}</div>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="inline-flex items-center gap-1 bg-neutrals-100 rounded-xl p-1" role="tablist">
            <button type="button" data-tipo="barras" class="bg-samu text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Barras</button>
            <button type="button" data-tipo="pizza" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-neutrals-600">Pizza</button>
            <button type="button" data-tipo="rosca" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-neutrals-600">Rosca</button>
        </div>
        {% if intervalo %}
        <label class="flex items-center gap-2 text-xs text-neutrals-600">Intervalo: <input data-dias type="number" min="1" value="{{ intervalo_padrao|default:30 }}" class="w-20 rounded-lg border border-neutrals-200 px-2 py-1 text-xs"> dias</label>
        {% endif %}
    </div>
    <div class="h-[280px]"><canvas id="canvas-{{ id }}"></canvas></div>
</div>
