<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Estrela da Vida com cruz vermelha estilizada -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#g)"/>
  <!-- Estrela da Vida simplificada -->
  <g transform="translate(64,64)" fill="white">
    <g>
      <!-- 6 pontas -->
      <polygon points="-32,0 -14,-10 -14,10"/>
      <polygon points="32,0 14,-10 14,10"/>
      <polygon points="-16,-28 0,-16 16,-28"/>
      <polygon points="-16,28 0,16 16,28"/>
      <polygon points="-28,-18 -12,-6 -28,6"/>
      <polygon points="28,-18 12,-6 28,6"/>
    </g>
    <circle r="12" fill="#DC2626"/>
    <!-- Cruz branca central -->
    <rect x="-2" y="-9" width="4" height="18" fill="white"/>
    <rect x="-9" y="-2" width="18" height="4" fill="white"/>
  </g>
  <text x="64" y="118" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">SAMU 192</text>
</svg>
